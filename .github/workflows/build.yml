name: Build VINI-JB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_15.0.app/Contents/Developer
      
    - name: Show Xcode version
      run: xcodebuild -version
      
    - name: List available simulators
      run: xcrun simctl list devices available
      
    - name: Build for iOS Simulator
      run: |
        xcodebuild clean build \
          -project VINI-JB.xcodeproj \
          -scheme VINI-JB \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
          -configuration Debug \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO
      
    - name: Build for iOS Device (Archive)
      run: |
        xcodebuild archive \
          -project VINI-JB.xcodeproj \
          -scheme VINI-JB \
          -configuration Release \
          -archivePath ${{ github.workspace }}/build/VINI-JB.xcarchive \
          CODE_SIGNING_ALLOWED=NO \
          COMPILER_INDEX_STORE_ENABLE=NO
      
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: VINI-JB-iOS
        path: |
          ${{ github.workspace }}/build/VINI-JB.xcarchive
        retention-days: 7
        
    - name: Upload build logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs
        path: |
          ~/Library/Logs/CoreSimulator/
          /tmp/xcodebuild_logs/
        retention-days: 3
